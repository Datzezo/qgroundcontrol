name: Build QGroundControl Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install aqt & Ninja
      run: |
        python -m pip install --upgrade pip
        pip install aqtinstall ninja

    - name: Install Qt 6
      run: |
        aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 -O C:\Qt

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build with CMake
      env:
        CMAKE_PREFIX_PATH: C:\Qt\6.6.3\msvc2019_64
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\Qt\6.6.3\msvc2019_64"
        cmake --build build --config Release

    - name: Deploy Qt Libraries
      run: |
        C:\Qt\6.6.3\msvc2019_64\bin\windeployqt.exe build/Release/QGroundControl.exe --qmldir src/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QGroundControl-Release
        path: build/Release/
        retention-days: 2
